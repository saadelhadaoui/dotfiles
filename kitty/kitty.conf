# ── Hollow Knight ── abyss black, pale shell, soul blue
font_family      Hack
font_size        11.0
disable_ligatures always

background_opacity 0.94
window_padding_width 6
hide_window_decorations no
confirm_os_window_close 0
enable_audio_bell no
cursor_shape block
cursor_blink_interval 0.6
url_style curly

# tmux draws its own tabs; kitty's only shows if you open kitty tabs
tab_bar_style powerline
tab_powerline_style slanted

# palette
foreground            #dcdfe8
background            #0b0d16
selection_foreground  #0b0d16
selection_background  #8fb0ec
cursor                #f2f0ea
cursor_text_color     #0b0d16
url_color             #5ec8d8
active_border_color   #8fb0ec
inactive_border_color #1f2433
active_tab_foreground   #0b0d16
active_tab_background   #f2f0ea
inactive_tab_foreground #6e7891
inactive_tab_background #12151f
tab_bar_background      #0b0d16
mark1_background #5ec8d8
mark2_background #e5b45a
mark3_background #c0393f

# black: abyss / void
color0  #0b0d16
color8  #3b4256
# red: hornet
color1  #c0393f
color9  #e0565c
# green: greenpath
color2  #7fae6e
color10 #a2cf8f
# yellow: geo
color3  #e5b45a
color11 #f2cf86
# blue: crossroads / soul
color4  #5b7fc7
color12 #8fb0ec
# magenta: dream nail
color5  #8f7ac9
color13 #b6a3e8
# cyan: lifeblood
color6  #5ec8d8
color14 #9be3ec
# white: pale shell
color7  #c8ccd8
color15 #f2f0ea
