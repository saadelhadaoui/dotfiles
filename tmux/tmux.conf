# ── general ──────────────────────────────────────────────
set -g default-terminal "tmux-256color"
# sync: terminal paints whole frames only (stops the cursor flicker next to the animated pane)
set -as terminal-features ",xterm-256color:RGB:sync,xterm-kitty:RGB:sync"
# lets fetch-pane --gif hand real images to kitty
set -g allow-passthrough on
if-shell "test -x /usr/bin/fish" "set -g default-shell /usr/bin/fish"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on

# prefix: Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# splits keep cwd, | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"
# vim-style pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── 3d theme (hollow knight), static — animation lives in the fetch pane ───────────────
set -g status-interval 15
set -g status-position top
set -g status-justify left
set -g status-style "bg=#0b0d16,fg=#dcdfe8"
set -g status-left-length 60
set -g status-right-length 120

# raised session block, then mode badge (only when active)
set -g status-left "#[bg=#0b0d16 fg=#f2f0ea]░▒▓#[bg=#f2f0ea fg=#0b0d16 bold] #S #[nobold bg=#0b0d16 fg=#f2f0ea]▓▒░#{?client_prefix,#[bg=#0b0d16 fg=#c0393f]░▒▓#[bg=#c0393f fg=#0b0d16 bold] PREFIX #[nobold bg=#0b0d16 fg=#c0393f]▓▒░,#{?pane_in_mode,#[bg=#0b0d16 fg=#e5b45a]░▒▓#[bg=#e5b45a fg=#0b0d16 bold] COPY #[nobold bg=#0b0d16 fg=#e5b45a]▓▒░,}} "
set -g status-right "#[bg=#0b0d16 fg=#8fb0ec]░▒▓#[bg=#8fb0ec fg=#0b0d16 bold] %H:%M #[nobold bg=#0b0d16 fg=#8fb0ec]▓▒░"

# inactive tabs are flat and sunk; active tab is a raised block
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#3b4256] #I #W "
setw -g window-status-current-format "#[fg=#1f2433]░▒▓#[bg=#1f2433,fg=#8fb0ec,bold] #I #W#{?window_zoomed_flag, ◆,} #[nobold,bg=#0b0d16,fg=#1f2433]▓▒░"
setw -g window-status-activity-style "fg=#e5b45a"
setw -g monitor-activity on
set -g visual-activity off

# depth: focused pane is lit, others recede
set -g window-style "bg=#080a11,fg=#6e7891"
set -g window-active-style "bg=default,fg=#dcdfe8"
set -g pane-border-lines heavy
set -g pane-border-style "bg=#080a11,fg=#1f2433"
set -g pane-active-border-style "bg=#080a11,fg=#f2f0ea"
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#f2f0ea bold]▶ ,#[fg=#3b4256]  }#{?#{==:#{pane_title},sysinfo},sysinfo,#{pane_current_command}} "

set -g message-style "bg=#1f2433,fg=#8fb0ec,bold"
set -g mode-style "bg=#2a3150,fg=#dcdfe8"
set -g display-panes-active-colour "#f2f0ea"
set -g display-panes-colour "#3b4256"
setw -g clock-mode-colour "#f2f0ea"
